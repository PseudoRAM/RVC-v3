# Initial compatibility baseline. Upgrade the ML stack in a measured follow-up.
image: "r8.im/pseudoram/rvc-v3"
build:
  gpu: true
  cuda: "11.8"
  python_version: "3.10"
  python_requirements: "requirements.txt"
  system_packages:
    - "ffmpeg"
    - "libsndfile1"
  run:
    - "python -m pip install pip==24.0 setuptools==69.5.1 wheel==0.43.0"
    # Fairseq's legacy OmegaConf metadata requires pip < 24.1.
    - "python -m pip install fairseq==0.12.2"
predict: "predict.py:Predictor"
